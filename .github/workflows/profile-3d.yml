name: Generate 3D contribution graph

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d
  cancel-in-progress: false

env:
  PROFILE_YEAR: "2026"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate 3D contribution SVGs
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          YEAR: ${{ env.PROFILE_YEAR }}

      - name: Add temporal context to 3D SVG
        run: >-
          python3 scripts/postprocess_profile_3d.py
          --input profile-3d-contrib/profile-night-green.svg
          --year "$PROFILE_YEAR"

      - name: Validate generated 3D SVG
        run: >-
          python3 scripts/postprocess_profile_3d.py
          --input profile-3d-contrib/profile-night-green.svg
          --year "$PROFILE_YEAR"
          --check

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(profile): update 3D contribution graph"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
