name: Generate 3D contribution graph

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d
  cancel-in-progress: false

env:
  PROFILE_YEAR: "2026"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate profile scripts
        run: >-
          python3 -m py_compile
          scripts/fetch_profile_languages.py
          scripts/postprocess_profile_3d.py

      - name: Generate 3D contribution SVGs
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          YEAR: ${{ env.PROFILE_YEAR }}

      - name: Fetch yearly language contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 scripts/fetch_profile_languages.py
          --user "${{ github.repository_owner }}"
          --year "$PROFILE_YEAR"
          --output /tmp/profile-languages.json

      - name: Enhance dark 3D SVG
        run: >-
          python3 scripts/postprocess_profile_3d.py
          --input profile-3d-contrib/profile-night-green.svg
          --year "$PROFILE_YEAR"
          --theme dark
          --languages-json /tmp/profile-languages.json

      - name: Enhance light 3D SVG
        run: >-
          python3 scripts/postprocess_profile_3d.py
          --input profile-3d-contrib/profile-green.svg
          --year "$PROFILE_YEAR"
          --theme light
          --languages-json /tmp/profile-languages.json

      - name: Validate enhanced 3D SVGs
        run: |
          python3 scripts/postprocess_profile_3d.py \
            --input profile-3d-contrib/profile-night-green.svg \
            --year "$PROFILE_YEAR" \
            --theme dark \
            --check
          python3 scripts/postprocess_profile_3d.py \
            --input profile-3d-contrib/profile-green.svg \
            --year "$PROFILE_YEAR" \
            --theme light \
            --check

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/profile-night-green.svg profile-3d-contrib/profile-green.svg
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(profile): update adaptive 3D contribution graphs"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
